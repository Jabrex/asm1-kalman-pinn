# Influent-information ablation (revision experiment P2-10): the model input
# keeps only the measurable influent flow Q_in(t); the 14-component influent
# fractionation - which no real plant measures online - is withheld.

models: [cl_pinn]
noise_levels: [0.0, 0.10]
seed: 0

data_dir: results/raw
out_dir: results/runs_flowonly
train_end_day: 12.0
holdout_days: [12.0, 14.0]

profile: full
steps_quick: 4000
steps_full: 20000
collocation_points: 512

lr: 1.0e-3
lr_final_fraction: 0.02
grad_clip: 1.0
log_every: 100

device: cuda
dtype: float32

pinn:
  hidden_width: 128
  hidden_depth: 5
  activation: tanh
  derivative_mode: forward
  features:
    periods: [1.0, 7.0]
    harmonics: [4, 2]
    include_influent: true
    include_influent_composition: false

lstm:
  hidden_size: 128
  num_layers: 2
  bidirectional: false
  dropout: 0.0
  features:
    periods: [1.0, 7.0]
    harmonics: [4, 2]
    include_influent: true
