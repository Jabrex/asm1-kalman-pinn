# Noise levels 0, 0.05 and 0.15 on the four key cells (0.10 is in grid_main).
out_root: results/v11/observers
sigmas: [0.0, 0.05, 0.15]
q_modes: [tuned, frozen]
q_criterion: innovation
estimators: [ekf, eks, ieks, ekf_online]
ras_filter_window: 4
cells:
  - {name: k000_ie_a0, data_dir: results/raw, anchor_file: results/v11/anchors/k000/A0.npz, influent_mode: exact}
  - {name: k100_ie_a0, data_dir: results/raw_k100, anchor_file: results/v11/anchors/k100/A0.npz, influent_mode: exact}
  - {name: k100_ic_as, data_dir: results/raw_k100, anchor_file: results/v11/anchors/k100/As.npz, influent_mode: composite}
  - {name: k100_ic_al1, data_dir: results/raw_k100, anchor_file: results/v11/anchors/k100/Al1.npz, influent_mode: composite}
