# Main regime grid at sigma 0.10: kinetics x influent knowledge x anchor.
# 5 x 3 x 4 = 60 cells, each with tuned and frozen q.
out_root: results/v11/observers
anchors_root: results/v11/anchors
sigmas: [0.10]
q_modes: [tuned, frozen]
q_criterion: innovation
estimators: [ekf, eks, ieks, ekf_aug, eks_aug, ekf_online]
augment_file: results/v11/analysis/kinetic_subset.json
ras_filter_window: 4
grid:
  kinetics: [k000, k025, k050, k075, k100]
  influent: [exact, composite, composite_biased]
  anchors: [A0, As, Al1, Al2]
