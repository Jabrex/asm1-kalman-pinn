# RAS probe against no RAS probe: the ideal-settler closure replaces the
# measured RAS TSS by TSS_5 (Q_in + Q_r) / (Q_r + Q_w) inside the model.
out_root: results/v11/observers
sigmas: [0.10]
q_modes: [tuned]
q_criterion: innovation
estimators: [ekf, eks]
ras_filter_window: 4
cells:
  - {name: k100_ie_a0_ideal_settler, data_dir: results/raw_k100, anchor_file: results/v11/anchors/k100/A0.npz, influent_mode: exact, ras_mode: ideal_settler}
